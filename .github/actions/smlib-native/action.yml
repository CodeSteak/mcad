name: SMLib (native)
description: >
  Fetches SMLib (tangency-labs/smlib @ the commit in smlib/fetch.sh + smlib/patches) and
  restores the native static libraries from the cache or builds them; sets SMLIB_PREBUILT.
inputs:
  smlib-url:
    description: Clone URL of the SMLib fork (empty = the default in smlib/fetch.sh)
    required: false
    default: ""
outputs:
  cache-hit:
    description: "'true' if the libraries came from the cache"
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: SMLib cache key
      id: key
      shell: bash
      run: echo "key=${{ runner.os }}-$(scripts/ci/smlib-key.sh native)" >> "$GITHUB_OUTPUT"

    - name: Restore native SMLib
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: smlib/build-native/lib
        key: ${{ steps.key.outputs.key }}

    - name: Fetch SMLib, build if not cached
      shell: bash
      env:
        SMLIB_URL: ${{ inputs.smlib-url }}
      run: scripts/ci/smlib-native.sh

    - name: Save native SMLib
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: smlib/build-native/lib
        key: ${{ steps.key.outputs.key }}
