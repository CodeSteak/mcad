# Desktop app (Tauri 2): UI build without Wasm (pnpm build:tauri), release build of `cad`
# with the embedded UI and the native SMLib, end-to-end tests with tauri-driver and
# WebKitWebDriver under Xvfb (file watcher, git markers, `cad ui …`, section view, watchdog).
#
# Locally: scripts/ci/smlib-native.sh && SMLIB_PREBUILT=smlib/build-native scripts/ci/desktop.sh ui build e2e
name: desktop

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.97.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Tauri system packages, Xvfb, WebKitWebDriver
        run: scripts/ci/desktop.sh deps

      - name: SMLib (native)
        uses: ./.github/actions/smlib-native
        with:
          smlib-url: ${{ secrets.SMLIB_CLONE_URL }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop

      - name: tauri-driver
        run: scripts/ci/desktop.sh e2e-deps

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: scripts/ci/web.sh install

      - name: UI for the desktop app (web/dist-tauri)
        run: scripts/ci/desktop.sh ui

      - name: cargo build --release -p cad-cli (feature gui)
        run: scripts/ci/desktop.sh build

      - name: Tauri end-to-end tests (Xvfb)
        run: scripts/ci/desktop.sh e2e

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e
          path: reports/tmp/report9
          if-no-files-found: ignore
          retention-days: 14
