# solidcore coverage, weekly: `mcad diff-kernels` over the examples against the newest
# solidcore `main` instead of the commit pinned in crates/kernel-solidcore/Cargo.toml
# (docs/solidcore-umstieg.md). Reports the numbers only (job summary, artifact
# `solidcore-coverage` with diff-kernels.json): unsupported, blocked or differing nodes do not
# fail the job; a build failure (API change in solidcore) or a crash of diff-kernels does.
# Locally: scripts/ci/smlib-native.sh && SMLIB_PREBUILT=smlib/build-native scripts/ci/solidcore.sh
name: solidcore

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      rev:
        description: "solidcore commit (full hash) or main"
        required: false
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.97.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: SMLib (native)
        uses: ./.github/actions/smlib-native
        with:
          smlib-url: ${{ secrets.SMLIB_CLONE_URL }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: solidcore

      - name: diff-kernels against solidcore main
        env:
          SOLIDCORE_REV: ${{ inputs.rev || 'main' }}
        run: scripts/ci/solidcore.sh target/solidcore-coverage

      - name: Upload diff-kernels result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcore-coverage
          path: target/solidcore-coverage/
          if-no-files-found: warn
