# Wasm + web: smlib.wasm (emsdk 6.0.13, cached), cad-wasm via wasm-bindgen, then the web app:
# typecheck, Vitest, Node tests of the engine, production build, Playwright (Chromium).
#
# Artefacts: web/dist (on success), Playwright report and traces (on failure).
# Locally: scripts/ci/smlib-wasm.sh && scripts/ci/web.sh wasm install typecheck unit node build e2e
name: web

# Heavy (emsdk, Playwright): only on pushes to main and by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.97.0 (wasm32)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: SMLib (Wasm)
        uses: ./.github/actions/smlib-wasm
        with:
          emsdk-version: "6.0.13"
          smlib-url: ${{ secrets.SMLIB_CLONE_URL }}

      - name: wasm-bindgen-cli (version from Cargo.lock)
        run: scripts/ci/wasm-bindgen.sh

      - name: cad-wasm -> web/src/wasm-pkg
        run: scripts/ci/web.sh wasm

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: scripts/ci/web.sh install

      - name: pnpm typecheck
        run: scripts/ci/web.sh typecheck

      - name: pnpm test (Vitest)
        run: scripts/ci/web.sh unit

      - name: Node tests (smlib.wasm, engine smoke test, transport)
        run: scripts/ci/web.sh node

      - name: pnpm build
        run: scripts/ci/web.sh build

      - name: Upload web/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 14

      - name: Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (pnpm e2e)
        run: scripts/ci/web.sh e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            reports/tmp/report2/playwright.json
          if-no-files-found: ignore
          retention-days: 14
