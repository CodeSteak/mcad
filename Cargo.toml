[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
insta = "1"
cad-syntax = { path = "crates/cad-syntax" }
cad-eval = { path = "crates/cad-eval" }
cad-ir = { path = "crates/cad-ir" }
cad-kernel = { path = "crates/cad-kernel" }
kernel-mock = { path = "crates/kernel-mock" }
kernel-smlib = { path = "crates/kernel-smlib" }
cad-engine = { path = "crates/cad-engine" }
cad-render = { path = "crates/cad-render" }
cad-session = { path = "crates/cad-session" }
cad-step = { path = "crates/cad-step" }
kernel-solidcore = { path = "crates/kernel-solidcore", default-features = false }

[profile.release]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
