[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = { version = "1", features = ["pure"] }
insta = "1"
cad-syntax = { path = "crates/cad-syntax" }
cad-eval = { path = "crates/cad-eval" }
cad-ir = { path = "crates/cad-ir" }
cad-kernel = { path = "crates/cad-kernel" }
kernel-mock = { path = "crates/kernel-mock" }
cad-engine = { path = "crates/cad-engine" }
cad-render = { path = "crates/cad-render" }
cad-session = { path = "crates/cad-session" }
cad-measure = { path = "crates/cad-measure" }
cad-step = { path = "crates/cad-step" }
cad-i18n = { path = "crates/cad-i18n" }
cad-tess = { path = "crates/cad-tess" }
kernel-solidcore = { path = "crates/kernel-solidcore" }

[profile.release]
opt-level = 3
debug = false

# The browser module (`web/scripts/build-wasm.sh`, cad-wasm with solidcore): release with fat
# LTO and one codegen unit (34.3 MB, 6.7 MB Brotli). opt-level "z" is 25 % smaller in Brotli
# (5.0 MB) but evaluates 2.4 times slower (macropad 85 s instead of 36 s in Node).
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# the tessellator is hot in debug builds too (render, export, tests)
[profile.dev.package.cad-tess]
opt-level = 2
