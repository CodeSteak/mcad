[package]
name = "cad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command line interface: check, eval, inspect, render, export, …; without a command the desktop UI"

[[bin]]
name = "mcad"
path = "src/main.rs"

[features]
# Opt-in (`cargo build -p cad-cli --features solidcore`): links solidcore for `diff-kernels` and
# `--kernel solidcore`. Without it the CLI does not compile solidcore; `diff-kernels` and
# `--kernel solidcore` explain how to build it.
# `gui` (default): `mcad`, `mcad datei.mcad`, `mcad ordner/` start the desktop UI (Tauri 2, needs
# WebKitGTK on Linux). `--no-default-features` builds a headless CLI only.
default = ["gui"]
gui = ["dep:cad-app"]
solidcore = ["kernel-solidcore/solidcore"]

[dependencies]
cad-session.workspace = true
cad-eval.workspace = true
cad-syntax.workspace = true
cad-render.workspace = true
cad-kernel.workspace = true
cad-engine.workspace = true
cad-measure.workspace = true
cad-i18n.workspace = true
kernel-smlib.workspace = true
kernel-solidcore.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
notify = "8"
similar = "2"
cad-desktop = { path = "../cad-desktop" }
cad-ipc = { path = "../cad-ipc" }
cad-app = { path = "../cad-app", optional = true }
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cad-step.workspace = true
assert_cmd = "2"
png = "0.17"
tempfile = "3"
cad-stl = { path = "../cad-stl" }
