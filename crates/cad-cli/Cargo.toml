[package]
name = "cad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command line interface: check, eval, inspect, render, export"

[[bin]]
name = "cad"
path = "src/main.rs"

[dependencies]
cad-session.workspace = true
cad-render.workspace = true
cad-kernel.workspace = true
kernel-smlib.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
cad-engine.workspace = true
assert_cmd = "2"
tempfile = "3"
