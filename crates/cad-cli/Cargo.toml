[package]
name = "cad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command line interface: check, eval, inspect, render, export, diff-kernels"

[[bin]]
name = "cad"
path = "src/main.rs"

[features]
# Opt-in (`cargo build -p cad-cli --features solidcore`): links solidcore for `diff-kernels`.
# Without it the CLI does not compile solidcore and `diff-kernels` explains how to build it.
default = []
solidcore = ["kernel-solidcore/solidcore"]

[dependencies]
cad-session.workspace = true
cad-eval.workspace = true
cad-syntax.workspace = true
cad-render.workspace = true
cad-kernel.workspace = true
cad-engine.workspace = true
kernel-smlib.workspace = true
kernel-solidcore.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
notify = "8"
similar = "2"

[dev-dependencies]
cad-step.workspace = true
assert_cmd = "2"
png = "0.17"
tempfile = "3"
