[package]
name = "cad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command line interface: check, eval, inspect, render, export, diff-kernels"

[[bin]]
name = "cad"
path = "src/main.rs"

[features]
default = ["solidcore"]
# `diff-kernels` with solidcore linked (else it reports every operation as Unsupported).
solidcore = ["kernel-solidcore/solidcore"]

[dependencies]
cad-session.workspace = true
cad-render.workspace = true
cad-kernel.workspace = true
cad-engine.workspace = true
kernel-smlib.workspace = true
kernel-solidcore.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
cad-step.workspace = true
assert_cmd = "2"
tempfile = "3"
