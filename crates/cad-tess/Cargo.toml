[package]
name = "cad-tess"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tessellator for the neutral B-rep (cad_kernel::brep): watertight triangle meshes within a chordal tolerance"

[features]
# Lets the corpus example (`examples/corpus.rs`) mesh solidcore's B-reps as well.
solidcore = ["kernel-solidcore/solidcore"]

[dependencies]
cad-kernel.workspace = true
glam.workspace = true
spade = { version = "2.15", default-features = false }

[dev-dependencies]
cad-session.workspace = true
kernel-smlib.workspace = true
kernel-solidcore.workspace = true
serde_json.workspace = true
