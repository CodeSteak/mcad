[package]
name = "cad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wasm-bindgen entry for the browser worker: cad_session::Session over kernel-smlib (wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

# Only meaningful on wasm32-unknown-unknown (build: web/scripts/build-wasm.sh). On native
# targets the crate is empty so `cargo test --workspace` stays native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cad-session.workspace = true
cad-i18n.workspace = true
kernel-smlib = { path = "../kernel-smlib", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde.workspace = true
