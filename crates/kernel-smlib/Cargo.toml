[package]
name = "kernel-smlib"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cad_kernel::Kernel over SMLib (tangency-labs/smlib @ 7eba8aa, based on NVIDIA usd-brep c9c5979) through a C++ facade"
build = "build.rs"

[features]
default = ["native"]
# C++ facade + SMLib/SM_API linked statically (CLI, tests).
native = ["dep:cc", "dep:cmake"]
# wasm32-unknown-unknown: calls smlib.wasm (Emscripten) through js/smlib-bridge.js.
wasm = ["dep:wasm-bindgen"]

[dependencies]
cad-kernel.workspace = true
glam.workspace = true
wasm-bindgen = { version = "0.2.100", optional = true }

[build-dependencies]
cc = { version = "1.2", optional = true }
cmake = { version = "0.1.54", optional = true }
