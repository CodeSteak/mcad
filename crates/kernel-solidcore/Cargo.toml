[package]
name = "kernel-solidcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cad_kernel::Kernel over solidcore (Rust port of SMLib), as far as its public API reaches today"

[features]
# Opt-in: without it the crate builds without solidcore (nothing of it is compiled) and every
# operation is Unsupported.
default = []
solidcore = ["dep:solidcore"]
# Probe of solidcore's ops layer: `cargo run -p kernel-solidcore --features ops-probe --example ops_probe`
ops-probe = ["dep:solidcore-ops", "dep:solidcore-record", "dep:solidcore-tess"]

[dependencies]
cad-kernel.workspace = true
glam.workspace = true
# tangency-labs/solidcore main @ 513e6fc (2026-11-06 04:28 UTC), Apache-2.0. Builds with Rust 1.97
# (solidcore pins 1.98 in its own rust-toolchain.toml, which does not apply to dependents).
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "513e6fcfcd049d41e9487599880479de4add63f2", optional = true }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "513e6fcfcd049d41e9487599880479de4add63f2", optional = true }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "513e6fcfcd049d41e9487599880479de4add63f2", optional = true }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "513e6fcfcd049d41e9487599880479de4add63f2", optional = true }

[[example]]
name = "ops_probe"
required-features = ["ops-probe"]
