[package]
name = "kernel-solidcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cad_kernel::Kernel over solidcore (Rust port of SMLib), as far as its public API reaches today"

[dependencies]
cad-kernel.workspace = true
# tessellation of the neutral B-rep (plan 2.8)
cad-tess.workspace = true
glam.workspace = true
# tangency-labs/solidcore main @ 55d0e76 (2026-11-11 19:30 UTC, crate 1.0.1), Apache-2.0. Builds with Rust 1.97
# (solidcore pins 1.98 in its own rust-toolchain.toml, which does not apply to dependents). Polyhedra are built
# with solidcore's BrepConstructor (src/polyhedron.rs): upstream deleted step-brep and step-import (#14038, #14194).
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "55d0e7638b9e1ebbf91ab8c10657e595c114ecda" }
