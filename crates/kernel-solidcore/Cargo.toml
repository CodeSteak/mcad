[package]
name = "kernel-solidcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cad_kernel::Kernel over solidcore (Rust port of SMLib), as far as its public API reaches today"

[features]
# Opt-in: without it the crate builds without solidcore (nothing of it is compiled) and every
# operation is Unsupported.
default = []
solidcore = ["dep:solidcore", "dep:step-brep", "dep:step-import", "dep:cad-tess"]

[dependencies]
cad-kernel.workspace = true
# tessellation of the neutral B-rep (plan 2.8)
cad-tess = { workspace = true, optional = true }
glam.workspace = true
# tangency-labs/solidcore main @ f4f05b1 (2026-11-04 05:18 UTC, crate 1.0.1), Apache-2.0. Builds with Rust 1.97
# (solidcore pins 1.98 in its own rust-toolchain.toml, which does not apply to dependents).
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "f4f05b147551201e2a7b44a34fbc41ddc0fc6578", optional = true }
# polyhedra (make_polyhedron) as planar faces through the STEP builder of the same commit
step-brep = { git = "https://github.com/tangency-labs/solidcore", rev = "f4f05b147551201e2a7b44a34fbc41ddc0fc6578", optional = true }
step-import = { git = "https://github.com/tangency-labs/solidcore", rev = "f4f05b147551201e2a7b44a34fbc41ddc0fc6578", optional = true }
